name: village_calendar
description: My Village Pro — Complete Accountability Edition for single parents managing child care and transport networks.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_riverpod: ^2.6.1
  geolocator: ^14.0.2
  google_fonts: ^8.1.0
  google_maps_flutter: ^2.10.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  http: ^1.2.2
  purchases_flutter: ^8.3.0
  table_calendar: ^3.1.2
  uuid: ^4.5.1
  shared_preferences: ^2.3.3
  flutter_slidable: ^3.1.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  workmanager: ^0.5.2
  local_auth: ^2.3.0
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/icons/
