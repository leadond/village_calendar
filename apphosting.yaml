# Settings for Cloud Run
runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

# Environment variables and secrets
env:
  - variable: EXPO_PUBLIC_CONVEX_URL
    value: https://shocking-lark-950.convex.cloud
    availability: [BUILD, RUNTIME]
  
  - variable: EXPO_PUBLIC_PRIVACY_POLICY_URL
    value: https://myvillage.devapphero.com/privacy-policy
    availability: [BUILD, RUNTIME]

  - variable: EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY
    secret: EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY
    availability: [BUILD, RUNTIME]

# Build and Run Scripts
scripts:
  buildCommand: npm run build
  runCommand: npx serve -s dist -l $PORT

# Include the dist folder in the deployment output
outputFiles:
  serverApp:
    include: [dist]
